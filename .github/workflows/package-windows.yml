name: Windows standalone EXE

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'run.py'
      - 'tests/**'
      - 'requirements-lock.txt'
      - 'package-onefile.spec'
      - '.github/workflows/package-windows.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'run.py'
      - 'tests/**'
      - 'requirements-lock.txt'
      - 'package-onefile.spec'
      - '.github/workflows/package-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-standalone-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }

      - name: Run regression tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp | Out-Null
          python -m pytest -q --basetemp .tmp/package-tests
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }

      - name: Build standalone Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean package-onefile.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          if (-not (Test-Path dist/WeChatFileManager.exe)) { throw 'Single EXE missing' }
          if (Test-Path dist/WeChatFileManager/_internal) { throw 'Unexpected onedir package' }
          Write-Host "EXE size: $((Get-Item dist/WeChatFileManager.exe).Length) bytes"

      - name: Smoke-test standalone EXE on Windows
        shell: pwsh
        run: |
          $env:WFM_DATA_DIR = Join-Path $PWD '.tmp/standalone-smoke'
          $env:QT_QPA_PLATFORM = 'windows'
          New-Item -ItemType Directory -Force -Path $env:WFM_DATA_DIR | Out-Null
          $exe = (Resolve-Path '.\dist\WeChatFileManager.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $errorReport = Join-Path $env:WFM_DATA_DIR 'selftest-error.txt'
            if (Test-Path $errorReport) { Get-Content $errorReport }
            throw 'Standalone EXE native self-test failed'
          }
          $report = Join-Path $env:WFM_DATA_DIR 'selftest.json'
          if (-not (Test-Path $report)) { throw 'Standalone EXE emitted no self-test result' }
          Get-Content $report
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash
          Write-Host "Standalone EXE SHA-256: $hash"

      - name: Upload EXE for PR review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: WeChatFileManager-standalone-Windows-x64
          path: dist/WeChatFileManager.exe
          retention-days: 14
          if-no-files-found: error

      - name: Publish single EXE as rolling GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = 'dist/WeChatFileManager.exe'
          $title = '微信文件管理器 Windows 最新版'
          $notes = '直接下载 WeChatFileManager.exe 即可运行，无需 ZIP 或 _internal 文件夹。此标签随 main 分支的已通过测试构建更新。'
          gh release view desktop-latest --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create desktop-latest $asset --target $env:GITHUB_SHA --title $title --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create release' }
          } else {
            gh release upload desktop-latest $asset --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release EXE' }
            gh api "repos/$env:GITHUB_REPOSITORY/git/refs/tags/desktop-latest" -X PATCH -f sha="$env:GITHUB_SHA" -F force=true | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update rolling release tag' }
            gh release edit desktop-latest --title $title --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update release metadata' }
          }
          Write-Host 'Direct EXE: https://github.com/JmCake/WeChat-File-Manager/releases/download/desktop-latest/WeChatFileManager.exe'
